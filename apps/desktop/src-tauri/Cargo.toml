[package]
name = "xifeng"
version = "0.3.0"
description = "Xifeng 桌面壳：Tauri 窗口 + Python 核心子进程"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.15"
winreg = "0.52"
ime-post = { path = "../../../crates/ime-post" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# e2e：便携壳自动化验证用（voice_test 合成按键/注入 smoke 后门）。
# 正式安装器不带——release 构建里该命令显式报错，收攻击面。
e2e = []
