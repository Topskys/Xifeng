[workspace]
resolver = "2"
members = ["crates/ime-post", "crates/ime-vad", "crates/ime-py"]
# Tauri 壳独立于 PyO3 扩展工作区：依赖树完全不同，混在一起会让 `cargo test -p ime-post`
# 顺带解析整棵 tauri 依赖。
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
